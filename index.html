<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>語詞簿產生器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.4/dist/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/opencc-js@1.4.2/dist/umd/t2cn.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --desk:#e7ede8; --panel:#fbfcfa; --ink:#1e2a2b; --muted:#5b6a67;
  --rule:#cfd9d4; --accent:#1f6f94; --accent-ink:#ffffff; --field:#ffffff;
  --warn-bg:#fff4d6; --warn-ink:#6b4d00; --edited:#e3f1f8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#131a1a; --panel:#1b2424; --ink:#e4ebe9; --muted:#9aaaa6;
    --rule:#2e3b3b; --accent:#6db5d6; --accent-ink:#0e1b21; --field:#141c1c;
    --warn-bg:#3a3014; --warn-ink:#f1d98f; --edited:#1d3440;
  }
}
:root[data-theme="dark"]{
  --desk:#131a1a; --panel:#1b2424; --ink:#e4ebe9; --muted:#9aaaa6;
  --rule:#2e3b3b; --accent:#6db5d6; --accent-ink:#0e1b21; --field:#141c1c;
  --warn-bg:#3a3014; --warn-ink:#f1d98f; --edited:#1d3440;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--desk);color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  font-size:15px;line-height:1.55;
}
.app{display:grid;grid-template-columns:minmax(300px,360px) 1fr;min-height:100vh}
aside{
  background:var(--panel);border-right:1px solid var(--rule);
  padding:22px 20px 40px;display:flex;flex-direction:column;gap:18px;
}
h1{
  font-family:"LXGW WenKai TC","DFKai-SB","BiauKai",serif;
  font-weight:700;font-size:30px;line-height:1.1;margin:0;letter-spacing:.04em;
}
.lede{margin:4px 0 0;color:var(--muted);font-size:13.5px}
label.t{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
textarea{
  width:100%;min-height:120px;resize:vertical;padding:10px 12px;
  font:inherit;font-size:16px;line-height:1.7;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:8px;
}
.hint{color:var(--muted);font-size:12.5px;margin-top:4px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.row>div{flex:1 1 120px}
select{
  width:100%;padding:8px 10px;font:inherit;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:8px;
}
.seg{display:flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:7px 4px;cursor:pointer;font-size:14px;background:var(--field)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-3px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
button{
  font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
}
button.ghost{background:transparent;color:var(--accent)}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.notice{background:var(--warn-bg);color:var(--warn-ink);padding:10px 12px;border-radius:8px;font-size:13px}
.notice[hidden]{display:none}
.status{font-size:13px;color:var(--muted);min-height:1.2em}

.proof h2{font-size:15px;margin:0 0 2px}
.proof .hint{margin:0 0 10px}
.plist{display:flex;flex-direction:column;gap:8px;max-height:46vh;overflow:auto;padding-right:4px}
.pword{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 8px;border:1px solid var(--rule);border-radius:8px}
.pword.edited{background:var(--edited)}
.pchar{display:flex;align-items:center;gap:4px}
.pchar b{font-family:"DFKai-SB","BiauKai","標楷體","LXGW WenKai TC",serif;font-size:20px;font-weight:400}
.pchar input{
  width:64px;padding:3px 6px;font:inherit;font-size:14px;color:var(--ink);background:var(--field);
  border:1px solid var(--rule);border-radius:6px;
}
.pword .reset{margin-left:auto;padding:2px 8px;font-size:12px;font-weight:500}

main{padding:24px;overflow:auto;min-width:0}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px;transform-origin:top center}
.pcount{text-align:center;color:var(--muted);font-size:13px;margin:0 0 12px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--rule)}
  .plist{max-height:none}
  main{padding:16px 8px}
}
</style>
<style id="sheet-css">
.page.capturing{box-shadow:none}
.page{
  width:210mm;height:297mm;padding:10mm;background:#fff;color:#1d3446;
  box-shadow:0 1px 3px rgba(30,50,60,.18),0 8px 24px rgba(30,50,60,.10);
  flex:none;
}
.grid{display:flex;width:189mm;border:0.7mm solid #2b86b3;height:calc(var(--T) + var(--R) * var(--s) + 1.4mm)}
.grid.rtl{flex-direction:row-reverse}
.col{display:flex;flex-direction:column;width:var(--cw);flex:none}
.grid:not(.rtl) .col{border-left:0.7mm solid #2b86b3}
.grid.rtl .col{border-right:0.7mm solid #2b86b3}
.col .top{height:var(--T);border-bottom:0.7mm solid #2b86b3;flex:none}
.cell{display:flex;height:var(--s);flex:none;border-bottom:0.25mm solid #7fb6d2}
.cell:last-child{border-bottom:0}
.sq{position:relative;width:var(--sq);height:100%;border-right:0.25mm solid #7fb6d2;display:flex;align-items:center;justify-content:center}
.sq::before,.sq::after{content:"";position:absolute;border:0 dashed #b9d7e6}
.sq::before{left:50%;top:0;bottom:0;border-left-width:0.2mm}
.sq::after{top:50%;left:0;right:0;border-top-width:0.2mm}
.ch{position:relative;z-index:1;font-size:calc(var(--sq) * .78);line-height:1;color:#1d3446;font-family:var(--font)}
.zy{width:var(--zw);height:100%;display:flex;align-items:center;justify-content:center;font-family:var(--font);overflow:hidden}
.zyb{display:flex;justify-content:center;font-size:var(--zf);color:#1d3446;padding-right:.34em}
.stk{display:flex;flex-direction:column;align-items:center;line-height:1.04}
.sy{position:relative;display:block}
.sy .tn{position:absolute;left:100%;top:-.08em;width:.32em;height:.58em;margin-left:.03em;overflow:visible}
.lt{display:block;height:.34em}
.lt .dot{display:block;width:.24em;height:.24em;margin:.04em auto 0;border-radius:50%;background:currentColor}
.tn i{position:absolute;display:block;width:.075em;background:currentColor;border-radius:.04em}
.t2 i{left:45%;top:8%;height:84%;transform:rotate(32deg)}
.t4 i{left:45%;top:8%;height:84%;transform:rotate(-32deg)}
.t3 i{left:45%;top:18%;height:62%;transform-origin:50% 100%}
.t3 i:first-child{transform:rotate(-24deg)}
.t3 i:last-child{transform:rotate(24deg)}
.faint .ch,.faint .zyb{color:#b3d0df}
.label{width:var(--L);flex:none;display:flex;flex-direction:column}
.label .top{height:var(--T);border-bottom:0.7mm solid #2b86b3;display:flex;align-items:center;justify-content:center;font-family:var(--font);font-size:4.6mm;color:#2b6f93}
.label .top span{display:flex;flex-direction:column;align-items:center;gap:2mm;line-height:1}
.label .rest{flex:1}
@page{size:A4 portrait;margin:10mm}
@media print{
  html,body{background:#fff !important;height:auto;min-height:0}
  :root{padding:0 !important}
  .no-print{display:none !important}
  .app,main{display:block !important;padding:0 !important;overflow:visible !important}
  .pages{zoom:1 !important;transform:none !important;gap:0 !important;display:block !important}
  .page{width:auto;height:auto;padding:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="app">
  <aside class="no-print">
    <div>
      <h1>語詞簿產生器</h1>
      <p class="lede">輸入語詞，自動配上注音，排成 A4 直式練習頁，可以直接列印或存成 PDF。</p>
    </div>

    <div>
      <label class="t" for="words">語詞</label>
      <textarea id="words" spellcheck="false"></textarea>
      <div class="hint">用「、」「，」、空白或換行分隔都可以。</div>
    </div>

    <div class="row">
      <div>
        <label class="t" for="perPage">每頁語詞數</label>
        <select id="perPage">
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
        </select>
      </div>
      <div>
        <label class="t" for="font">字體</label>
        <select id="font">
          <option value="kai">標楷體（電腦內建）</option>
          <option value="wenkai">霞鶩文楷（網路字型）</option>
        </select>
      </div>
    </div>

    <div>
      <span class="t" style="display:block;font-weight:600;font-size:14px;margin-bottom:6px">排列方向</span>
      <div class="seg" role="radiogroup" aria-label="排列方向">
        <label><input type="radio" name="dir" value="rtl">由右到左</label>
        <label><input type="radio" name="dir" value="ltr">由左到右</label>
      </div>
    </div>

    <label class="check"><input type="checkbox" id="trace"> 範字下方加一組淺色描寫字</label>

    <div class="actions">
      <button id="pdfBtn">下載 PDF</button>
      <button id="printBtn" class="ghost">列印</button>
      <button id="dlBtn" class="ghost">下載 HTML 檔</button>
    </div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="hint" style="margin-top:-10px">要列印的話，建議先按「下載 PDF」，用 PDF 閱讀器或瀏覽器打開後再列印，版面最穩定。</div>

    <div class="notice" id="libWarn" hidden>注音資料沒有載入成功，請在下方「注音校對」手動填入注音，或重新整理頁面再試一次。</div>

    <section class="proof">
      <h2>注音校對</h2>
      <p class="hint">注音是自動判斷的，破音字可能會錯。直接修改框裡的注音，預覽會同步更新；輕聲寫成「˙ㄗ」，聲調寫在最後，例如「ㄌㄧㄥˋ」。</p>
      <div class="plist" id="plist"></div>
    </section>
  </aside>

  <main>
    <p class="pcount no-print" id="pcount"></p>
    <div class="pages" id="pages"></div>
  </main>
</div>

<script>
(function(){
"use strict";

/* ---------- storage (per-viewer convenience) ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};

/* ---------- pinyin → 注音 ---------- */
const INI={b:"ㄅ",p:"ㄆ",m:"ㄇ",f:"ㄈ",d:"ㄉ",t:"ㄊ",n:"ㄋ",l:"ㄌ",g:"ㄍ",k:"ㄎ",h:"ㄏ",j:"ㄐ",q:"ㄑ",x:"ㄒ",zh:"ㄓ",ch:"ㄔ",sh:"ㄕ",r:"ㄖ",z:"ㄗ",c:"ㄘ",s:"ㄙ"};
const FIN={a:"ㄚ",o:"ㄛ",e:"ㄜ","ê":"ㄝ",ai:"ㄞ",ei:"ㄟ",ao:"ㄠ",ou:"ㄡ",an:"ㄢ",en:"ㄣ",ang:"ㄤ",eng:"ㄥ",er:"ㄦ",ong:"ㄨㄥ",
i:"ㄧ",ia:"ㄧㄚ",io:"ㄧㄛ",ie:"ㄧㄝ",iao:"ㄧㄠ",iu:"ㄧㄡ",iou:"ㄧㄡ",ian:"ㄧㄢ",in:"ㄧㄣ",iang:"ㄧㄤ",ing:"ㄧㄥ",iong:"ㄩㄥ",
u:"ㄨ",ua:"ㄨㄚ",uo:"ㄨㄛ",uai:"ㄨㄞ",ui:"ㄨㄟ",uei:"ㄨㄟ",uan:"ㄨㄢ",un:"ㄨㄣ",uen:"ㄨㄣ",uang:"ㄨㄤ",ueng:"ㄨㄥ",
"ü":"ㄩ","üe":"ㄩㄝ","üan":"ㄩㄢ","ün":"ㄩㄣ"};
const YW={yi:"i",ya:"ia",yo:"io",ye:"ie",yao:"iao",you:"iou",yan:"ian",yin:"in",yang:"iang",ying:"ing",yong:"iong",yu:"ü",yue:"üe",yuan:"üan",yun:"ün",
wu:"u",wa:"ua",wo:"uo",wai:"uai",wei:"uei",wan:"uan",wen:"uen",wang:"uang",weng:"ueng"};
const TONE={1:"",2:"ˊ",3:"ˇ",4:"ˋ"};
function py2zy(py){
  const m=/^([a-zü]+)([0-5])?$/.exec(String(py).replace(/v/g,"ü"));
  if(!m) return "";
  let s=m[1],t=m[2]||"1",ini="",fin;
  if(YW[s]) fin=YW[s];
  else{
    for(const k of ["zh","ch","sh"]) if(s.startsWith(k)){ini=k;break;}
    if(!ini&&INI[s[0]]) ini=s[0];
    fin=s.slice(ini.length);
    if(fin==="i"&&/^(zh|ch|sh|r|z|c|s)$/.test(ini)) fin="";
    if(/^[jqx]$/.test(ini)&&fin.startsWith("u")) fin="ü"+fin.slice(1);
  }
  if(fin&&!(fin in FIN)) return "";
  const body=(ini?INI[ini]:"")+(fin?FIN[fin]:"");
  if(!body) return "";
  return (t==="0"||t==="5")?"˙"+body:body+TONE[t];
}

/* 台灣讀音與大陸不同的常見字（非輕聲時套用） */
const TW_CHAR={危:"wei2",微:"wei2",期:"qi2",究:"jiu4",質:"zhi2",綜:"zong4",寂:"ji2",擊:"ji2",息:"xi2",惜:"xi2",夕:"xi4",昔:"xi2",跡:"ji1",酵:"xiao4",髮:"fa3",攜:"xi1",癌:"yan2",帆:"fan2",企:"qi4",暫:"zhan4",蝸:"wo1"};
const TW_WORD={垃圾:["ㄌㄜˋ","ㄙㄜˋ"],頭髮:["ㄊㄡˊ","ㄈㄚˇ"],星期:["ㄒㄧㄥ","ㄑㄧˊ"],休息:["ㄒㄧㄡ","˙ㄒㄧ"],企鵝:["ㄑㄧˋ","ㄜˊ"]};

let libOK=false, toSimp=null;
try{
  if(window.pinyinPro&&window.OpenCC){toSimp=OpenCC.Converter({from:"tw",to:"cn"});libOK=true;}
}catch(e){libOK=false}

const autoCache=new Map();
function autoZhuyin(word){
  if(autoCache.has(word)) return autoCache.get(word).slice();
  const chars=[...word];
  let out;
  if(TW_WORD[word]) out=TW_WORD[word].slice();
  else if(!libOK) out=chars.map(()=> "");
  else{
    let simp=toSimp(word);
    if([...simp].length!==chars.length) simp=chars.map(c=>toSimp(c)).join("");
    let arr=pinyinPro.pinyin(simp,{toneType:"num",type:"array",v:true,toneSandhi:false});
    if(arr.length!==chars.length) arr=[...simp].map(c=>pinyinPro.pinyin(c,{toneType:"num",v:true,toneSandhi:false}));
    out=chars.map((c,i)=>{
      let p=arr[i]||"";
      if(TW_CHAR[c]&&!/0$/.test(p)) p=TW_CHAR[c];
      return py2zy(p);
    });
  }
  autoCache.set(word,out);
  return out.slice();
}

/* ---------- state ---------- */
const DEFAULT_WORDS="繞口令、由於、暴風雨、迷失、上岸、撞到、趕緊、扶著、商店、老闆、飛機、用料、實在、獅子、停留、參觀、有趣";
const saved=store.get("yuci:settings",{});
const state={
  words:typeof saved.words==="string"?saved.words:DEFAULT_WORDS,
  perPage:saved.perPage||6,
  dir:saved.dir||"rtl",
  font:saved.font||"kai",
  trace:!!saved.trace
};
let overrides=store.get("yuci:zy",{});

const $=id=>document.getElementById(id);
const els={words:$("words"),perPage:$("perPage"),font:$("font"),trace:$("trace"),pages:$("pages"),plist:$("plist"),pcount:$("pcount"),status:$("status")};
els.words.value=state.words;
els.perPage.value=String(state.perPage);
els.font.value=state.font;
els.trace.checked=state.trace;
document.querySelectorAll('input[name="dir"]').forEach(r=>{r.checked=r.value===state.dir});
if(!libOK) $("libWarn").hidden=false;

function parseWords(s){return s.split(/[、，,;；\s]+/).map(w=>w.trim()).filter(Boolean)}
function zhuyinOf(word){
  const o=overrides[word];
  const n=[...word].length;
  if(Array.isArray(o)&&o.length===n) return o.slice();
  return autoZhuyin(word);
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const FONTS={
  kai:'"DFKai-SB","BiauKai","標楷體","TW-Kai","LXGW WenKai TC",serif',
  wenkai:'"LXGW WenKai TC","DFKai-SB","BiauKai","標楷體",serif'
};

const TONE_HTML={
  "ˊ":'<span class="tn t2"><i></i></span>',
  "ˇ":'<span class="tn t3"><i></i><i></i></span>',
  "ˋ":'<span class="tn t4"><i></i></span>'
};
function zyHTML(z){
  if(!z) return "";
  let light=false,tone="",body=z.trim();
  if(body.startsWith("˙")){light=true;body=body.slice(1)}
  const last=body.slice(-1);
  if("ˊˇˋ".includes(last)){tone=last;body=body.slice(0,-1)}
  if(body.endsWith("˙")){light=true;body=body.slice(0,-1)}
  const syms=[...body];
  let h='<span class="zyb"><span class="stk">';
  if(light) h+='<span class="lt"><i class="dot"></i></span>';
  syms.forEach((c,i)=>{
    const last=i===syms.length-1;
    h+='<span class="sy">'+esc(c)+(last&&tone?TONE_HTML[tone]:'')+'</span>';
  });
  return h+'</span></span>';
}

/* ---------- layout ---------- */
function geometry(n){
  const W=189,H=275,L=10,border=1.4;
  const cw=(W-border-L)/n;                  // 欄寬含欄線（border-box）
  const inner=cw-0.7;
  const zw=+(inner*0.3).toFixed(2);
  const sq=+(inner-zw).toFixed(2);
  const s=sq;                               // 列高 = 方格邊長
  const minTop=30;
  const R=Math.floor((H-border-minTop)/s);
  const T=+(H-border-R*s).toFixed(2);
  const zf=+Math.min(s*0.26,zw*0.6).toFixed(2);
  return {cw:+cw.toFixed(2),zw,sq,s,R,T,L,zf};
}

function renderPages(){
  const words=parseWords(state.words);
  const n=+state.perPage;
  const g=geometry(n);
  const chunks=[];
  for(let i=0;i<words.length;i+=n) chunks.push(words.slice(i,i+n));
  if(!chunks.length) chunks.push([]);
  const vars=`--cw:${g.cw}mm;--zw:${g.zw}mm;--sq:${g.sq}mm;--s:${g.s}mm;--R:${g.R};--T:${g.T}mm;--L:${g.L}mm;--zf:${g.zf}mm;--font:${FONTS[state.font]}`;
  const dirCls=state.dir==="rtl"?"grid rtl":"grid";
  let html="";
  for(const chunk of chunks){
    let cols='<div class="label"><div class="top"><span><i style=\"font-style:normal\">訂</i><i style=\"font-style:normal\">正</i></span></div><div class="rest"></div></div>';
    for(let k=0;k<n;k++){
      const w=chunk[k];
      const chars=w?[...w]:[];
      const zys=w?zhuyinOf(w):[];
      let cells="";
      for(let r=0;r<g.R;r++){
        let cls="cell",ch="",zy="";
        if(r<chars.length){ch=chars[r];zy=zys[r]}
        else if(state.trace&&r<chars.length*2){cls+=" faint";ch=chars[r-chars.length];zy=zys[r-chars.length]}
        cells+=`<div class="${cls}"><div class="sq">${ch?'<span class="ch">'+esc(ch)+'</span>':""}</div><div class="zy">${zyHTML(zy)}</div></div>`;
      }
      cols+=`<div class="col"><div class="top"></div>${cells}</div>`;
    }
    html+=`<section class="page" style="${esc(vars)}"><div class="${dirCls}">${cols}</div></section>`;
  }
  els.pages.innerHTML=html;
  els.pcount.textContent=words.length?`共 ${words.length} 個語詞，${chunks.length} 頁`:"還沒有語詞，先在左邊輸入。";
  fitPreview();
}

function fitPreview(){
  const main=els.pages.parentElement;
  const pagePx=210*96/25.4;
  const avail=main.clientWidth-(window.innerWidth<=820?16:48);
  const z=Math.min(1,Math.max(.3,avail/pagePx));
  els.pages.style.zoom=z;
}

function renderProof(){
  const words=[...new Set(parseWords(state.words))];
  const focused=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  let h="";
  for(const w of words){
    const zys=zhuyinOf(w);
    const edited=Array.isArray(overrides[w]);
    h+=`<div class="pword${edited?" edited":""}" data-word="${esc(w)}">`;
    [...w].forEach((c,i)=>{
      h+=`<span class="pchar"><b>${esc(c)}</b><input aria-label="${esc(w)} 的「${esc(c)}」注音" data-key="${esc(w)}|${i}" data-i="${i}" value="${esc(zys[i]||"")}"></span>`;
    });
    if(edited) h+=`<button class="ghost reset" data-reset="${esc(w)}">還原自動注音</button>`;
    h+="</div>";
  }
  els.plist.innerHTML=h||'<p class="hint">輸入語詞後，這裡會列出每個字的注音。</p>';
  if(focused){
    const el=els.plist.querySelector(`input[data-key="${CSS.escape(focused)}"]`);
    if(el){el.focus();const v=el.value.length;el.setSelectionRange(v,v)}
  }
}

function saveSettings(){store.set("yuci:settings",state)}
let t1=null;
function refresh(proof){
  clearTimeout(t1);
  t1=setTimeout(()=>{renderPages();if(proof)renderProof();saveSettings()},120);
}

/* ---------- events ---------- */
els.words.addEventListener("input",()=>{state.words=els.words.value;refresh(true)});
els.perPage.addEventListener("change",()=>{state.perPage=+els.perPage.value;refresh(false)});
els.font.addEventListener("change",()=>{state.font=els.font.value;refresh(false)});
els.trace.addEventListener("change",()=>{state.trace=els.trace.checked;refresh(false)});
document.querySelectorAll('input[name="dir"]').forEach(r=>r.addEventListener("change",()=>{if(r.checked){state.dir=r.value;refresh(false)}}));

els.plist.addEventListener("input",e=>{
  const inp=e.target.closest("input[data-i]");if(!inp)return;
  const box=inp.closest(".pword");const w=box.dataset.word;
  const vals=[...box.querySelectorAll("input[data-i]")].map(x=>x.value.trim());
  overrides[w]=vals;
  box.classList.add("edited");
  if(!box.querySelector(".reset")){
    const b=document.createElement("button");b.className="ghost reset";b.dataset.reset=w;b.textContent="還原自動注音";box.appendChild(b);
  }
  store.set("yuci:zy",overrides);
  refresh(false);
});
els.plist.addEventListener("click",e=>{
  const b=e.target.closest("button[data-reset]");if(!b)return;
  delete overrides[b.dataset.reset];
  store.set("yuci:zy",overrides);
  renderProof();renderPages();
});
window.addEventListener("resize",fitPreview);

$("printBtn").addEventListener("click",()=>{
  try{window.print()}catch(e){els.status.textContent="這個視窗不允許列印，請改用「下載 HTML 檔」。"}
});

function exportHTML(){
  const sheetCSS=$("sheet-css").textContent;
  return `<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>語詞簿</title>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#e7ede8;font-family:"Microsoft JhengHei",system-ui,sans-serif}
.bar{position:sticky;top:0;z-index:5;background:#1f6f94;color:#fff;padding:10px 16px;font-size:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.bar button{font:inherit;font-weight:600;padding:6px 14px;border-radius:6px;border:0;background:#fff;color:#1f6f94;cursor:pointer}
.pages{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 0}
${sheetCSS}
</style></head><body>
<div class="bar no-print"><button onclick="window.print()">列印 / 存成 PDF</button><span>或按 Ctrl+P（Mac：⌘+P），目的地選「另存為 PDF」，邊界選「預設」。</span></div>
<div class="pages">${els.pages.innerHTML}</div>
</body></html>`;
}

let downloadsP=Promise.resolve(null);
try{if(window.claude&&typeof window.claude.use==="function")downloadsP=window.claude.use("downloads")}catch(e){}

$("dlBtn").addEventListener("click",async()=>{
  const d=new Date();
  const name=`語詞簿-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.html`;
  els.status.textContent="";
  await saveFile(name,exportHTML(),"已下載，用瀏覽器打開後就能列印。");
});

async function makePDF(){
  if(!window.html2canvas||!window.jspdf){els.status.textContent="PDF 元件沒有載入成功，請重新整理頁面再試，或改用「下載 HTML 檔」。";return}
  const btn=$("pdfBtn");btn.disabled=true;
  const oldZoom=els.pages.style.zoom;
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    els.pages.style.zoom=1;
    const pages=[...els.pages.querySelectorAll(".page")];
    const pdf=new jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
    for(let i=0;i<pages.length;i++){
      els.status.textContent=`正在產生 PDF（${i+1}/${pages.length}）…`;
      const pg=pages[i];pg.classList.add("capturing");
      const canvas=await html2canvas(pg,{scale:3,backgroundColor:"#ffffff",useCORS:true,logging:false});
      pg.classList.remove("capturing");
      if(i>0) pdf.addPage("a4","portrait");
      pdf.addImage(canvas.toDataURL("image/jpeg",0.92),"JPEG",0,0,210,297,undefined,"FAST");
    }
    els.pages.style.zoom=oldZoom;fitPreview();
    const d=new Date();
    const name=`語詞簿-${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}.pdf`;
    const blob=pdf.output("blob");
    await saveFile(name,blob,"PDF 已下載，打開後就可以列印。");
  }catch(e){
    console.error(e);els.status.textContent="產生 PDF 時發生錯誤，請改用「下載 HTML 檔」。";
  }finally{
    els.pages.style.zoom=oldZoom;fitPreview();btn.disabled=false;
  }
}
async function saveFile(name,data,okMsg){
  let dl=null;
  try{dl=await downloadsP}catch(e){dl=null}
  if(dl){
    try{await dl.save({filename:name,data});els.status.textContent=okMsg}
    catch(err){
      const code=err&&err.code;
      if(code==="declined") els.status.textContent="已取消下載。";
      else if(code==="rate_limited") els.status.textContent="下載確認視窗已經開著，請先處理它。";
      else els.status.textContent="這個視窗無法下載檔案。";
    }
    return;
  }
  try{
    const blob=data instanceof Blob?data:new Blob([data],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
    els.status.textContent=okMsg;
  }catch(e){els.status.textContent="這個視窗無法下載檔案。"}
}
$("pdfBtn").addEventListener("click",makePDF);

renderPages();
renderProof();
})();
</script>
</body>
